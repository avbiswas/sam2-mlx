[project]
name = "sam-mlx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Avishek Biswas", email = "sudavivi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=0.31",
    "mlx>=0.31.2",
    "numpy>=2.2",
    "opencv-python>=4.13.0.92",
    "pillow>=11.0",
    "safetensors>=0.5",
]

[project.scripts]
sam-mlx = "sam_mlx:main"
sam-mlx-convert = "sam_mlx.convert:main"

[project.optional-dependencies]
torch-parity = [
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
